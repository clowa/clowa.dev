name: Azure Static Web Apps CI/CD

# Deploys to production on push to main.
# On PRs, builds both swa and api to validate changes. Deployment to a staging environment
# is skipped for Dependabot PRs since they don't have access to deployment secrets.
# See: https://learn.microsoft.com/en-us/azure/static-web-apps/review-publish-pull-requests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  NODE_VERSION: 22

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: static-web-app
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: Setup node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: ${ env.NODE_VERSION }

      # Build the Astro frontend. The output is written to swa/dist/ and passed
      # directly to the deploy action via app_location to skip a redundant rebuild.
      - name: Install dependencies (swa)
        working-directory: swa/
        run: npm ci --no-audit --no-fund

      - name: Restore cached assets
        id: cache-assets
        uses: actions/cache/restore@v4
        with:
          path: swa/.cache
          key: swa-assets
        
      - name: Build (swa)
        working-directory: swa/
        run: npm run build
        env:
          PUBLIC_RYBBIT_SITE_ID: ${{ secrets.PUBLIC_RYBBIT_SITE_ID }}

      # Build the Azure Functions API to validate TypeScript compiles on every PR,
      # including Dependabot. The deploy action rebuilds the API itself to retain
      # runtime language detection via Oryx.
      - name: Install dependencies (api)
        working-directory: api/
        run: npm ci --no-audit --no-fund

      - name: Build (api)
        working-directory: api/
        run: npm run build

      - name: Deploy
        if: github.actor != 'dependabot[bot]'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          api_location: "api" # Api source code path - optional
          app_location: "swa/dist" # Pre-built app content directory
          ###### End of Repository/Build Configurations ######
          skip_app_build: true
        env:
          PUBLIC_RYBBIT_SITE_ID: ${{ secrets.PUBLIC_RYBBIT_SITE_ID }}

      - name: Cache assets
        uses: actions/cache/save@v4
        with:
          path: swa/.cache
          key: ${{ steps.cache-assets.outputs.cache-primary-key }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: static-web-app
    name: Close Pull Request Job
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "swa" # App source code path
