service: clw-web-prod

plugins:
  - serverless-scaleway-functions

provider:
  name: scaleway

package:
  patterns:
    - "!node_modules/**"
    - "!.gitignore"
    - "!.git/**"

custom:
  containers:
    clw-web-prod:
      registryImage: ${env:REGISTRY_IMAGE}

      # OpenTelemetry: every process (Caddy + the api) exports OTLP to the
      # in-container otel-collector on loopback; the collector is the sole egress
      # to Middleware and the only holder of the API key (below). Standard OTEL_*
      # vars keep this backend-agnostic. OTEL_SERVICE_NAME here is Caddy's; the api
      # overrides it to quote-api in its s6 run script.
      env:
        OTEL_SERVICE_NAME: web-proxy
        OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
        OTEL_EXPORTER_OTLP_PROTOCOL: grpc
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=clowa,deployment.environment.name=production
        OTEL_TRACES_SAMPLER: parentbased_traceidratio
        OTEL_TRACES_SAMPLER_ARG: "0.1" # sample 10% of traces to control cost
        # Where the collector forwards telemetry (non-secret): Middleware, gRPC+TLS.
        MIDDLEWARE_OTLP_ENDPOINT: https://clowa-production.middleware.io:443
      # Scaleway "extra-secure" env var: the Middleware API key. Never committed —
      # resolved from the deploy environment (CI secret / 1Password). The collector
      # sends it as the bare `authorization` header and as the mw.account_key attr.
      secret:
        MIDDLEWARE_API_KEY: ${env:MIDDLEWARE_API_KEY}

      cpuLimit: 250
      memoryLimit: 512
      sandbox: v2
      port: 80

      minScale: 0
      maxScale: 3
      httpOption: redirected
      privacy: public
      timeout: 30s
      healthCheck:
        type: tcp
        port: 80
        interval: 10s
        failureThreshold: 3
      custom_domains:
        - clowa.dev
        # Redirect source hosts handled by Caddy (docker/caddy/redirects/). Each
        # must be DNS-verified and pointed at Scaleway before it can be attached
        # here, so they ship commented out — uncomment once DNS is in place.
        # - www.clowa.dev
        # - clowa.de
        # - me.clowa.de
        # - qunis.day
