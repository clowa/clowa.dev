version: "3"

tasks:
  npm-install:
    cmds:
      - |
        cd api && \
        sudo chown codespace:codespace node_modules && \
        npm install
      - |
        cd swa && \
        sudo chown codespace:codespace node_modules && \
        npm install

  build:
    cmds:
      - swa build --api-location api/ --app-location swa/ --auto

  run:
    deps:
      - build
    dir: .
    cmds:
      - |
        PATH="/opt/homebrew/opt/node@18/bin:$PATH"
        source .env
        swa start \
          --app-devserver-url http://localhost:4321 \
          --run 'npm run dev' \
          --app-location ./swa/ \
          --api-location ./api/ \
          --output-location dist/
